name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - simulator
        - replay / datasets
        - teleoperation / control
        - vision
        - firmware
        - web (inkmap / inkgen)
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands or code to reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, hardware (if relevant), and the commit or release you ran.
      placeholder: "Ubuntu 24.04, no robot hardware, main @ abc1234"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant output. Please redact any personal paths or addresses.
      render: text
