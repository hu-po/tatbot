name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: public CLI contract
        run: scripts/check cli

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: plugin tests
        run: |
          if [ -f python/lerobot_robot_tatbot/pyproject.toml ]; then
            uv run --project python/lerobot_robot_tatbot --with pytest --with pytest-timeout \
              pytest -q --timeout=120 python/lerobot_robot_tatbot/tests/
          fi
      - name: script suite
        run: |
          if [ -f scripts/tests/requirements.txt ]; then
            uvx --with-requirements scripts/tests/requirements.txt --with pytest-timeout \
              pytest -q --timeout=120 scripts/tests/
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: visiond
        run: |
          if [ -f rust/Cargo.toml ]; then
            cd rust
            cargo clippy --features rerun -- -D warnings
            cargo test --features rerun
          fi

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: teleop
        run: |
          if [ -f cpp/teleop/CMakeLists.txt ]; then
            cmake -B cpp/teleop/build -S cpp/teleop
            cmake --build cpp/teleop/build -j"$(nproc)"
            ctest --test-dir cpp/teleop/build --output-on-failure
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: inkmap
        # The web tests' pretest step compiles the showcase scenarios with
        # python/tatbot_sim/.venv, whose simulator import builds the tool URDF
        # from ManiSkill's WidowX AI asset. A hosted runner rasterises in
        # software, so the editor's workstation latency budget is relaxed.
        env:
          MS_ASSET_DIR: ${{ runner.temp }}/tatbot-sim-assets
          INKMAP_E2E_LATENCY_BUDGET_MS: "1000"
        run: |
          if [ -f web/inkmap/package.json ]; then
            uv sync --project python/tatbot_sim --extra maniskill
            uv run --project python/tatbot_sim --extra maniskill python -m mani_skill.utils.download_asset widowxai -y
            cd web/inkmap && npm ci && npm run check
          fi

  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web/inkmap
      - name: Simulator robot assets
        run: uv run --project python/tatbot_sim python -m mani_skill.utils.download_asset widowxai -y
      - name: Portable simulator tests with public fixtures
        run: |
          uv run --project python/tatbot_sim --with pytest --with pytest-timeout \
            pytest -ra --timeout=120 python/tatbot_sim/tests --sim-profile public
