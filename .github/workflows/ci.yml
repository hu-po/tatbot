name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,206,429
            --exclude 'x\.com'
            --exclude 'tiktok\.com'
            --exclude 'instagram\.com'
            --exclude 'poly\.cam'
            './**/*.md'
          fail: true

  # Build/test jobs for each component land with the 0.9.0 export; every PR
  # must be green here before review.
