# controller_manager and controllers for both arms; stack.launch.py spawns only the configured arms'.
# Names: ros/README.md "Names". JTC holds with the command interfaces' values on activation, which
# the driver sets to the measured pose.
#
# JTC tolerances. Jazzy's defaults (joint_trajectory_controller 4.42 parameters) are
# stopped_velocity_tolerance 0.01, goal_time 0.0 and every per-joint `trajectory`/`goal` 0.0, where 0
# means "not checked". Here all of them are 0: JTC never aborts or fails a goal on tracking error.
# The driver's stall guard is the one tracking interlock (stack.yaml safety.stall_*: 0.35 rad for 2 s
# with under 0.05 rad of progress, README section 8); the arm lags about 70 ms while tracking and sags
# 1-2 mrad at rest (README section 1), so a settle tolerance would only refuse good strokes. A goal
# succeeds when its time ends and the session plans the next op from the measured joints.
# Command limits are the controller's own (config/trossen goldens); controller_manager's
# enforce_command_limits stays at its Jazzy default, false.
controller_manager:
  ros__parameters:
    update_rate: 400
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_safety_controller:
      type: gpio_controllers/GpioCommandController
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_safety_controller:
      type: gpio_controllers/GpioCommandController

right_arm_controller:
  ros__parameters:
    joints: [right/joint_0, right/joint_1, right/joint_2, right/joint_3, right/joint_4, right/joint_5, right/left_carriage_joint]
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: true
    open_loop_control: false
    action_monitor_rate: 20.0
    constraints:                  # tracking is the driver's stall guard, not JTC's (see the top)
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

right_safety_controller:
  ros__parameters:
    update_rate: 100
    gpios: [right_safety]
    command_interfaces:
      right_safety:
        interfaces: [guard_mode, unlatch, land]
    state_interfaces:
      right_safety:
        interfaces: [estop_source, estop_ok, estop_age_s, probe_triggered, latched, latch_reason, guard_mode,
                     guard_tripped, trip_q0, trip_q1, trip_q2, trip_q3, trip_q4, trip_q5, trip_q6,
                     unlatch_ack, land_ack, landing, landed, controller_error, rt_period_max_ms]

left_arm_controller:
  ros__parameters:
    joints: [left/joint_0, left/joint_1, left/joint_2, left/joint_3, left/joint_4, left/joint_5, left/left_carriage_joint]
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    set_last_command_interface_value_as_state_on_activation: true
    open_loop_control: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

left_safety_controller:
  ros__parameters:
    update_rate: 100
    gpios: [left_safety]
    command_interfaces:
      left_safety:
        interfaces: [guard_mode, unlatch, land]
    state_interfaces:
      left_safety:
        interfaces: [estop_source, estop_ok, estop_age_s, probe_triggered, latched, latch_reason, guard_mode,
                     guard_tripped, trip_q0, trip_q1, trip_q2, trip_q3, trip_q4, trip_q5, trip_q6,
                     unlatch_ack, land_ack, landing, landed, controller_error, rt_period_max_ms]
