# `scripts/lib` is not a package: every script here runs from a bare clone with
# `sys.path.insert(0, "scripts/lib")` and no install, and that stays true.
#
# This file exists only so the uv projects under `python/` can depend on the
# handful of modules they share with the scripts, instead of reaching across the
# tree with `importlib.util.spec_from_file_location`. Each of those bespoke
# loaders had to re-register `sys.modules` by hand so dataclasses could resolve
# postponed annotations, and `ink_spec` carried a second copy of the same dance
# to import its own sibling.
#
# Only the shared modules are exported, deliberately. A module listed here is a
# cross-root contract: sim, the arm plugin and the scripts all get the same
# definition, and changing it changes all three.
#
# tatbot_paths is the exception that makes the list honest: its bootstrap()
# puts every script root on sys.path, so a consumer that needs more of the
# script tree calls it once instead of naming each module.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tatbot-scriptlib"
version = "0.1.0"
description = "Geometry, ink and run-log modules shared by the scripts, the simulator and the arm plugin"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "tatbot-contracts==0.1.0"]

[tool.setuptools]
py-modules = [
  "gpu_lease",
  "ink_spec",
  "tatbot_paths",
  "tatbot_runlog",
  "tool_spec",
]
packages = []
