# Tatbot DNS Edge Mode Configuration
# Public-safe example: all addresses and MACs are documentation placeholders.
# Authoritative DNS and DHCP server for standalone/edge operation
# Default mode on boot - provides local-first tatbot network

# Bind to specific interface
interface=eth0
bind-interfaces

# DNS configuration
domain=tatbot.example
expand-hosts
local=/tatbot.example/

# Upstream DNS for internet access (if available)
no-resolv
server=1.1.1.1
server=8.8.8.8

# DHCP configuration - cover the full range for static reservations (short lease for fast transitions)
dhcp-range=192.0.2.2,192.0.2.254,5m

# Static DHCP reservations for all tatbot devices
dhcp-host=02:00:00:00:00:14,camera1,192.0.2.91
dhcp-host=02:00:00:00:00:10,camera2,192.0.2.92
dhcp-host=02:00:00:00:00:11,camera3,192.0.2.93
dhcp-host=02:00:00:00:00:12,camera4,192.0.2.94
dhcp-host=02:00:00:00:00:13,camera5,192.0.2.95
dhcp-host=02:00:00:00:00:15,eek,192.0.2.97
dhcp-host=02:00:00:00:00:07,hog,192.0.2.88
dhcp-host=02:00:00:00:00:08,ojo,192.0.2.96
dhcp-host=02:00:00:00:00:09,ook,192.0.2.90
dhcp-host=02:00:00:00:00:03,oop,192.0.2.51
dhcp-host=02:00:00:00:00:05,rpi1,192.0.2.98
dhcp-host=02:00:00:00:00:06,rpi2,192.0.2.99
dhcp-host=02:00:00:00:00:04,tren,192.0.2.50
dhcp-host=02:00:00:00:00:01,trossen-arm-follower,192.0.2.3
dhcp-host=02:00:00:00:00:02,trossen-arm-leader,192.0.2.2

# Static hostname resolution
address=/camera1.tatbot.example/192.0.2.91
address=/camera2.tatbot.example/192.0.2.92
address=/camera3.tatbot.example/192.0.2.93
address=/camera4.tatbot.example/192.0.2.94
address=/camera5.tatbot.example/192.0.2.95
address=/eek.tatbot.example/192.0.2.97
address=/hog.tatbot.example/192.0.2.88
address=/ojo.tatbot.example/192.0.2.96
address=/ook.tatbot.example/192.0.2.90
address=/oop.tatbot.example/192.0.2.51
address=/rpi1.tatbot.example/192.0.2.98
address=/rpi2.tatbot.example/192.0.2.99
address=/tren.tatbot.example/192.0.2.50
address=/trossen-arm-follower.tatbot.example/192.0.2.3
address=/trossen-arm-leader.tatbot.example/192.0.2.2

# DHCP options
# ook as gateway for edge mode (has WiFi for internet access), rpi2 as DNS
dhcp-option=option:router,192.0.2.90
dhcp-option=option:dns-server,192.0.2.99
# Push domain search list to clients
dhcp-option=option:domain-search,tatbot.example
dhcp-option=option:domain-name,tatbot.example
# Make dnsmasq authoritative on this network segment
dhcp-authoritative
# Explicit lease file location
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
# Performance tuning
local-ttl=60
cache-size=1000

# Logging (disabled by default to reduce noise)
# log-queries
# log-dhcp

