# tatbot teleoperation: let the 400 Hz control loop run under SCHED_FIFO.
#
# wxai_teleop pins itself to the machine's fastest cores and requests
# SCHED_FIFO before connecting. Without this file RLIMIT_RTPRIO is 0 and the
# request is refused, leaving the loop an ordinary SCHED_OTHER task — on a
# hybrid CPU a busy machine then migrates it onto an E-core, where the same
# tick takes ~3x longer and the operator feels the lateness as shaking.
# See cpp/teleop/README.md "Loop health" for the measurements.
#
# Install on each host that runs the loop:
#   sudo cp config/limits/99-tatbot-realtime.conf /etc/security/limits.d/
#   # log out and back in, then: ulimit -r   # expect 90, not 0
#
# Scoped to the sudo group, which every tatbot operator account is in. Those
# users can already get real-time priority via sudo, so this grants no new
# authority — it just removes the need for sudo on the teleop.
@sudo   -   rtprio   90
