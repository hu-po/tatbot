# Ambition Lutin rotary machine fitted with a HAWINK 3RL bugpin X-taper
# cartridge (1003RL). A cartridge swap is a new tool_id because the tip moves
# and the tip is the calibration — see docs/tools.md.
#
# NOT YET USED ON THE RIG (operator, 2026-08-25). Body and cartridge lengths
# are now measured, so the assembled tip is derived rather than borrowed — but
# nothing has been touched off, so it is not confirmed. Run the tip phase
# before this steers an arm.
#
# SCHEMA 2 (2026-08-30): the same machine body now sits in the bore of the
# printed mount on the left finger carriage, so z = 0 is the MOUNT BORE FACE
# and the grip_* fields are gone. Same body, same bore position as
# lutin-ballpoint-dot; the 1 mm shorter cartridge is the whole difference,
# and it still needs its own touch-off (the tip is the calibration).
schema_version: 2
tool_id: lutin-3rl-bugpin
kind: rotary_pen
substrate: silicon_skin
display_name: "Ambition Lutin + HAWINK 3RL bugpin X-taper"
body: "Ambition Lutin Rotary (short pen, RCA)"
cartridge: "HAWINK 1003RL, 3 round liner, 0.30 mm bugpin, X-taper"
# 3RL is what a fineline machine draws with, so the prompt says liner, not
# "pen tip" — the phrase is what a language-conditioned policy sees.
prompt_phrase: "using a 3RL liner"

# [z_m, radius_m] along the tool axis, z = 0 at the mount bore face.
# Same machine as lutin-ballpoint-dot, so the same 80 mm body seated the same
# way in the bore (NOMINAL, see that file): rear -55, nose +25. The cartridge
# measures 34 mm (operator, 2026-08-25) — 1 mm shorter than the ballpoint's —
# putting this tip at +59, not +60. Total assembled 114 mm.
#
# The cartridge is conical and its outer half is TRANSLUCENT: the last ~17 mm
# is see-through with the 0.30 mm needle visible inside. Only the silhouette is
# modelled, since a profile of revolution cannot carry a material change. That
# translucency is the whole visual difference between this tool and the
# ballpoint, whose silhouettes are within a millimetre of each other.
#
# Needle 0.30 mm (#10 bugpin) over a 7.0 mm X-taper — an industry class scale
# (M 3.5 / L 5.5 / X 7.0 mm) confirmed by two independent suppliers.
profile: [
  [-0.055, 0.0145 ],
  [ 0.025, 0.0145 ],
  [ 0.059, 0.00015]
]
# What "3RL" means: 3 Round Liner, three needles grouped so they act as one
# point. The 34 mm the operator measured is the WHOLE cartridge, needle
# included, so it is split here: the display cone is scaled to ~31 mm of
# plastic housing (tip_mesh_scale 0.85 -> 0.78) and the last ~3 mm is the
# needles leaving it. Rendered the other way -- cone all the way to the tip,
# needles inside it -- the needles cannot be seen at any distance, which is
# what the first cut did.
# The profile and protrusion are UNCHANGED: the tip is still +59 mm, and the
# TCP with it. The profile ends in a single cone, which is the cartridge, not the
# needles that leave it -- so the three are modelled explicitly, each the
# 0.30 mm the datasheet already names, on the circle of radius s/sqrt(3) that
# three touching needles of diameter s sit on. Lengths are nominal: nobody has
# put calipers on the needle protrusion.
tip_detail:
  kind: needles
  count: 3
  radius_m: 0.00015
  length_m: 0.0042
  color: "0.80 0.81 0.84 1"

tip_mesh: pen_tip.stl
# The mesh is a 40 mm cone; this cartridge measures 34 mm.
tip_mesh_scale: [1.0, 1.0, 0.78]

# What the machine has in it now (operator swapped 4.0 -> 3.5 on 2026-08-25 for
# the ballpoint cartridge, which is rated 3.5 mm max). The pair is 3.5/4.0, so
# the 4.0 is the spare. A needle config has no such ceiling and may well want
# the 4.0 back for lining — decide that when this cartridge is actually fitted,
# and record what was chosen here.
stroke_mm: 3.5

# How far the needle stands out of the cartridge tip — a MACHINE ADJUSTMENT,
# not a property of the cartridge. Across the industry it is a 0 to 4.0/4.5 mm
# range in 0.1 mm (Cheyenne) or 0.2 mm (FK Irons) detents; the Lutin adjusts it
# with a steel-ball rotation collar. Practice guidance is 1.5-2 mm for lining.
#
# This is a calibration trap, and the reason it is recorded here rather than
# left implicit: turning that collar moves the TCP by up to 4 mm without
# touching anything else. That is well inside the 15 mm tip_tolerance below, so
# the touch-off gate would NOT catch it — a re-touch-off is required after any
# needle-depth change, and this field is what makes the setting reviewable.
# null = nobody has recorded where the collar is set.
needle_protrusion_mm: null

# Machined steps along the body — same body as lutin-ballpoint-dot.
rings: [
  [-0.036, 0.004, 0.0008],
  [-0.020, 0.003, 0.0008],
  [-0.004, 0.005, 0.0010],
  [ 0.012, 0.003, 0.0008]
]
body_color: "0.04 0.04 0.045 1"
tip_color: "0.93 0.93 0.92 1"

# THE SAME PHYSICAL MACHINE as lutin-ballpoint-dot (operator, 2026-08-25) —
# these two datasheets are one body with different cartridges in it, seated
# in the same bore of the same mount.
mount: tool_mount

# Vendor: 113 g body only, 184.5 g with the Korall RCA battery pack clipped on.
# Neither is weighed by us, and which applies depends on whether the pack rides
# on the machine during a session.
mass_kg: 0.113
com_z_m: null

# Wide while the bore position is nominal; tighten with the ballpoint's.
tip_tolerance_m: 0.030

# --- ink supply -------------------------------------------------------------
# The needle carries a CHARGE of ink between dips; see docs/ink.md and
# scripts/lib/ink_spec.py. Every number below is a GUESS (operator, 2026-08-28)
# to be refit from before/after cap weighings with `ink.py fit`; the ledger
# records contact_mm and contact_s next to every derived microlitre so the
# refit is always possible.
ink:
  mode: real
  charge_capacity_ul: 2.0
  uptake_ul: 1.5
  deposit_ul_per_mm: 0.004
  bleed_ul_per_s: 0.01
  dip_depth_m: 0.003
  dip_dwell_s: 0.4
  min_fill_frac: 0.25

measured:
  status: nominal
  utc: 2026-08-25T00:00:00Z
  method: "cartridge measured; body shared with lutin-ballpoint-dot"
  note: |
    SOURCED: body 80 mm long, 32 mm diameter, 113 g (ambitiontattoosupply.com,
    magnumtattoosupplies.co.uk). Cartridge code 1003RL decomposes to #10 =
    0.30 mm bugpin needle / 03 = 3 needles / RL = round liner (hawink.com,
    Amazon B087LVNDJC). Taper classes are an industry scale confirmed by two
    independent suppliers — M 3.5 mm, L 5.5 mm, X 7.0 mm — so X-Taper here is
    7.0 mm. Universal fit, with a safety membrane.

    MEASURED (operator, 2026-08-25): cartridge 34 mm, conical, outer half
    translucent with the needle visible inside. With the machine's 80 mm body
    that gives 114 mm assembled and a 59 mm protrusion.

    STILL UNCONFIRMED: no touch-off has been run with this cartridge fitted, so
    the tip position is derived from the shared grip point rather than measured
    in the EE frame. Cartridge body and tip-aperture diameters are published by
    nobody — a search of patents, IFU PDFs, FDA 510(k) filings and B2B listings
    found nothing, and the near-misses are traps (US6685719 is a surgical
    skin-marker ink reservoir; US11040185B2's 5-12 mm figures are internal
    magnets, not the housing).
