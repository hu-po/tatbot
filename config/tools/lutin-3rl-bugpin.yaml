# Ambition Lutin rotary machine fitted with a HAWINK 1003RL cartridge: 3 round
# liner, 0.30 mm bugpin needles, X-taper. The same machine body, in the same
# mount bore, as lutin-ballpoint-dot; only the cartridge differs.
#
# The needles travel 6 mm in the cartridge from fully retracted to fully out,
# and the machine strokes 4 mm of that; seated, a fresh cartridge's needles
# stand ~1 mm out of the tube wherever the motor stopped (operator, 2026-10-05;
# the first cartridge's sat inside it, 2026-10-04). The TCP is the centre of the
# tube's end, which the wrist gauge measures. Running, the needles reach
# needle_reach_mm past it at the bottom of each stroke: that, not the TCP, is
# what enters skin or ink. They should meet the skin in the last 25% of their
# extension (operator, 2026-10-05), so the tube's end rides
# needle_reach_mm - 0.25 * stroke_mm over the skin.
#
# Fitted on the pink arm 2026-10-04. The tip across its axis is the probe
# calibration's (tatbot ros calib run); its length is the ballpoint's seat,
# which the operator judges the same (2026-09-08). Drawing heights come from
# the wrist gauge, which measures the tube's end over the surface directly.
schema_version: 2
tool_id: lutin-3rl-bugpin
kind: rotary_pen
substrate: silicon_skin
display_name: "Ambition Lutin + HAWINK 3RL bugpin X-taper"
body: "Ambition Lutin Rotary (short pen, RCA)"
cartridge: "HAWINK 1003RL, 3 round liner, 0.30 mm bugpin, X-taper"
# 3RL is what a fineline machine draws with, so the prompt says liner, not
# "pen tip" -- the phrase is what a language-conditioned policy sees.
prompt_phrase: "using a 3RL liner"

# [z_m, radius_m] along the tool axis, z = 0 at the mount bore face: the
# machine body (lutin-ballpoint-dot's V17 silhouette), the cartridge's ~13 mm
# body, then its translucent nozzle as the palette camera saw it 7.8 mm over the
# probe ball (the joint-6 sweep's park still, 2026-10-05, 56.6 px/mm): ~1 mm across
# at its end, ~1.8 mm 4.5 mm up, ~4 mm 12 mm up, flaring into the body ~20 mm
# up. Rounded outward; the tube's end is at the TCP.
profile: [
  [-0.042,  0.0165 ],
  [ 0.005,  0.0165 ],
  [ 0.013,  0.016  ],
  [ 0.038,  0.016  ],
  [ 0.0385, 0.0070 ],
  [ 0.0530, 0.0070 ],
  [ 0.0553, 0.0039 ],
  [ 0.0580, 0.0028 ],
  [ 0.0606, 0.0020 ],
  [ 0.0630, 0.00145],
  [ 0.0660, 0.0012 ],
  [ 0.0685, 0.0009 ],
  [ 0.073,  0.0005 ]
]
# Three needles grouped so they act as one point, retracted inside the tube
# with the machine off; drawn as they sit at rest, behind the tube's end.
tip_detail:
  kind: needles
  count: 3
  radius_m: 0.00015
  length_m: 0.0042
  color: "0.80 0.81 0.84 1"
contact_radius_m: 0.0005

tip_mesh: pen_tip.stl
# The mesh is a 40 mm cone; this cartridge measures 34 mm.
tip_mesh_scale: [1.0, 1.0, 0.78]

# The machine's stroke (operator, 2026-10-05; the cam was 3.5 mm with a 4.0 spare).
stroke_mm: 4.0

# How far the needles reach past the tube's end at the bottom of the stroke:
# the collar setting (0 to ~4.5 mm on the Lutin's steel-ball collar). Turning
# the collar changes it without moving the TCP. 4.0 mm (2026-10-05): on a ride
# ladder on the silicone skin, the tube's end 5.0 down to 1.0 mm over the
# gauged surface in 0.5 mm steps with the machine running, the operator judged
# the 3.0 mm rung the right depth and stopped the ladder past 1.5 mm; with the
# needles meeting the skin in the last 25% of the stroke, that is 3.0 + 1.0.
# Neither the arm's joint nor carriage efforts resolved the contact.
needle_reach_mm: 4.0
# The needles at the top of the stroke are inside the tube.
tip_out_at_top_mm: null

rings: []
body_color: "0.04 0.04 0.045 1"
tip_color: "0.93 0.93 0.92 1"

mount: tool_mount

# Vendor: 113 g body only, 184.5 g with the Korall RCA battery pack.
mass_kg: 0.113
com_z_m: null

tip_tolerance_m: 0.025
seat_tolerance_deg: 15.0

# --- palette dips (ros/README.md section 6) ----------------------------------
# How the cartridge takes ink: the tube's end comes down the cap's axis to just
# over the ink and holds there with the machine running, and the needles'
# strokes pull ink up into the tube (operator, 2026-10-04). Nothing presses the
# tube into the ink.
dip:
  above_ink_m: 0.0005      # the tube's end this far over the declared ink level while the machine runs
  dwell_s: 1.5             # the machine running over the ink
  hover_m: 0.008           # the tube's end this far over the rim before it goes down and after it comes up
  speed_m_s: 0.010         # along the cap's axis, down and up
  wall_margin_m: 0.0015    # the tool's outside keeps this from the bore's wall, beyond the station's uncertainty
  mm_per_dip: 120.0        # line per dip until a bench measurement (dip, draw until it fades) replaces it; 3x the
                           # first guess (40), which dipped well before the line faded (operator, 2026-10-06)
  mm_per_dip_by_ink: {}    # {ink_id: mm}: measured per ink on this tool's substrate
  # A resource activated by a rinse (tatbot-inks/3 `activation: {method: rinse, slot, ink_id}`) takes the cartridge
  # from the last ink to its own in a cap of water, no landing: one dip there with the machine running, held longer
  # than an ink dip, the tube's end at the water's declared level so the stroking needles flush it (operator,
  # 2026-10-05).
  rinse_dwell_s: 10.0
  rinse_above_ink_m: 0.0

# --- ink supply, the simulator's volume model (scripts/lib/ink_spec.py) -----
# Guesses (operator, 2026-08-28) the simulator and `tatbot ink` read; the ROS
# stack reads `dip:` above.
ink:
  mode: real
  charge_capacity_ul: 2.0
  uptake_ul: 1.5
  deposit_ul_per_mm: 0.004
  bleed_ul_per_s: 0.01
  dip_depth_m: 0.003
  dip_dwell_s: 0.4
  min_fill_frac: 0.25

# --- station probe contact model (ros/README.md section 7) -------------------
# The tube's end is a halo: the nozzle's ring around the needles' exit hole,
# narrower than the probe's 2 mm ball. Side pairs touch the nozzle 3 mm up, where
# it is ~1.5 mm across: there the search passes 4 mm under the overhead fix's
# ball (which stood ~2 mm high on this station) and still meets the stylus, and
# its lines, spaced by the side radius, leave no gap a 1 mm nozzle slips through.
# The first two runs planned a 2.5 and a 4 mm tube and their 4-5 mm lines all
# missed (2026-10-05). The fit
# measures the side radius itself.
calibration:
  contact_reference: tube_end
  accuracy_profile: needle-tube
  feature: "the cartridge nozzle's end, needles retracted"
  face_kind: halo
  wall_radius_m: 0.00075        # the nozzle's outside 3 mm up
  face_radius_m: 0.0003         # the needles' exit hole
  rim_touch_radius_m: 0.0004    # an edge pass stops with the ball this far off the axis, under the ring
  side_touch_height_m: 0.003

measured:
  status: measured
  utc: 2026-10-05T02:40:00Z
  method: "nozzle silhouette from the palette camera; tip across its axis from the joint-6 sweep (2026-10-05); length from lutin-ballpoint-dot's V17 seat"
  note: |
    SOURCED: body 80 mm long, 32 mm diameter, 113 g. Cartridge code 1003RL:
    #10 = 0.30 mm bugpin needle, 03 = 3 needles, RL = round liner; X-taper is
    7.0 mm (M 3.5 / L 5.5 / X 7.0 mm). Universal fit, with a safety membrane.
    The cartridge's outer half is translucent with the needles visible inside.
