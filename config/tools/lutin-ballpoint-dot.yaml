# Installed V17 tool: calibrated contact vector and operator-confirmed diameters.
schema_version: 2
tool_id: lutin-ballpoint-dot
kind: ballpoint_pen
substrate: paper_pad
# The same cartridge draws on either gridded paper fixture (config/substrates.yaml).
substrates: ["paper_pad", "paper_cylinder"]
display_name: "Ambition Lutin + Inlumino ballpoint dot cartridge"
body: "Ambition Lutin Rotary (short pen, RCA)"
cartridge: "Inlumino Heart Ink ballpoint dot pen cartridge (0.5 mm ball)"
prompt_phrase: "using pen tip"

profile: [
  [-0.042, 0.0165],
  [ 0.005, 0.0165],
  [ 0.013, 0.016 ],
  [ 0.038, 0.016 ],
  [ 0.073, 0.001 ]
]
tip_detail:
  kind: ball
  radius_m: 0.0011
  # Proud of the 1.0 mm socket, so the ball is a ball rather than a rounding
  # of the cone, and dark enough to read as steel beside the white plastic:
  # _polish_ee_materials treats anything under 0.8 as metal.
  color: "0.58 0.60 0.65 1"
contact_radius_m: 0.00025

tip_mesh: pen_tip_v17.stl
tip_mesh_scale: [1.0, 1.0, 1.0]

# The machine's stroke with this cartridge: the 3.5 mm cam, fitted 2026-08-25 because the cartridge is
# rated 3.5 mm at most (lutin-3rl-bugpin.yaml keeps the swap's history).
stroke_mm: 3.5

# How far the ball stands out of the cartridge's tube at the top of its stroke (operator, 2026-09-30,
# again 2026-10-03). With the machine off the refill rests inside the tube (operator, 2026-10-03), so a
# machine-off touch meets the tube, not the ball. Over such touches the running pen first inked at a 3.7 mm
# ride and drew solid from 3.3 down to 2.5 mm (2026-10-03; motion.yaml pen.ride.fraction). Out of the
# machine the refill travels 6 mm between fully retracted and fully extended.
tip_out_at_top_mm: 2.0

# The line this cartridge lays on the paper pad, as drawn: 0.5 mm, measured
# by the operator on paper and confirmed 2026-09-16. Re-measure after a
# cartridge change or a different substrate: draw the five-line swatch with
# `tatbot draw run --design strokes` at the working speed on the gridded pad
# and read the width against the 6.35 mm grid pitch from the wrist camera
# (or a loupe). The fill planner's default width and the stroke schedule's
# dedup footprint read this; nothing about motion does.
line:
  width_mm: 0.5
  status: measured
  utc: 2026-09-16
  method: "Operator-measured on the paper pad, 0.5 mm as drawn; matches the Inlumino cartridge's 0.5 mm ball"
  substrate: paper_pad

rings: []
body_color: "0.04 0.04 0.045 1"
tip_color: "0.93 0.93 0.92 1"


mass_kg: 0.113
com_z_m: null

tip_tolerance_m: 0.025

mount: tool_mount

seat_tolerance_deg: 15.0
seat_residual_m: 0.0035

ink:
  # Self-contained refill; no wall-clock allowance or palette replenishment.
  mode: cartridge

# --- mechanical calibration (tatbot calib tip wrist palette --arm pink) ------
# The feature that meets the three-tip palette and the accuracy profile this
# tool is held to (scripts/lib/arm_calibration.py PROFILES). A ball wider than
# the pit mouth rests on the mouth rim, so the fitted point is the effective
# seated ball center; the writing-contact correction stays unresolved.
calibration:
  contact_reference: seated_ball
  accuracy_profile: ballpoint-precision
  feature: "ballpoint ball seated on the pit mouth"
  # The probe measures the rigid nozzle with side pairs and the compressed working ball axially on centre.
  # The refill still protrudes (tip_out_at_top_mm); off-centre axial contacts can mix ball and nozzle contact.
  face_kind: ballpoint_tip
  wall_radius_m: 0.00045        # the metal tip's outside where a side touch meets the ball: it tapers from
                                # 1.6 mm across at the body, 2.4 mm over the working tip, to 0.45 mm at the
                                # ball (palette camera, 2026-10-02)
  face_radius_m: 0.0001         # no bore the probe's ball could enter
  rim_touch_radius_m: 0.0003    # an edge pass stops with the tip this far off the ball's centre
  # The working ball projects 2.4 mm on a metal tip under the body's end. Side pairs touch
  # that tip, the point that draws (operator, 2026-10-02): the probe's ball 0.8 mm up it
  # stands 0.2-2.2 mm over the working ball, clear of the body's corner.
  side_touch_height_m: 0.0008

measured:
  status: measured
  utc: 2026-09-19
  method: "Operator-confirmed 32/33 mm body diameters; hand-guided three-pit palette calibration (tatbot calib tip wrist palette --arm pink, sweep-arm-pink-20260919_124146)"
  note: |
    V17 installed; front body 32 mm and rear body 33 mm confirmed by the
    operator on 2026-09-07. Datum is the first clamping band at CAD station
    73 mm from the tip. The seated ball center was measured at
    (0.020, -2.674, 74.245) mm in right/tool_mount on 2026-09-19
    (fit rms 2.473 mm, leave-one-out maximum 2.104 mm); the working
    tip in config/workspace.yaml is that point plus one ball radius along the
    tool axis. Assembly length 115 mm, cartridge 35 mm and the axial
    transitions retain their CAD/reference provenance. Mass is the vendor
    estimate.
