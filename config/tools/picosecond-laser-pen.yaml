# Handheld "picosecond laser pen" (tattoo removal).
#
# A consumer handheld whose optical claims are marketing copy: vendor
# listings give diode/LED wavelengths, none state a pulse width, spot size,
# fluence, or laser class, and a bench test found nothing picosecond about
# it. That is why no optical numbers appear below — this file describes the
# object's SHAPE so the robot can carry it. Nothing in a datasheet makes a
# laser safe to point at anyone.
schema_version: 2
# NO MOUNT (2026-08-30): the follower's tool bore is sized for the Lutin
# body and this wand has no adapter, so fitting/calibration/flight are
# refused (tool_spec.ToolMountError). The profile is kept in the OLD gripper
# frame (z = 0 at the fingertips, as measured) for the datasets recorded
# with it; re-measure from the adapter's bore face when one exists.
mount: none
tool_id: picosecond-laser-pen
kind: laser
substrate: silicon_skin
display_name: "Handheld picosecond-branded laser pen (tattoo removal)"
body: "consumer handheld pen, ABS shell, internal 1200 mAh battery"
cartridge: null
prompt_phrase: "with the removal laser"

# [z_m, radius_m] along the tool axis, z = 0 at the gripper fingertips.
# Traced from photographs on 6 mm graph paper (2026-08-25, 17.9 px/mm):
# 214 mm long, widest 37.8 mm — a 9 mm chrome tail cap, 141 mm of white
# shell swelling 27.5 → 37.8 mm, then 64 mm of chrome flaring down through
# a 13.7 mm stem to a 15.4 mm lens face.
# Grip measured on the arm 2026-08-25: the wand stands 130 mm proud of the
# fingertips, so the tail sits 84 mm behind the fingers and the profile is
# the traced silhouette shifted accordingly.
profile: [
  [-0.084, 0.0138],
  [-0.075, 0.0138],
  [-0.007, 0.0158],
  [ 0.060, 0.0189],
  [ 0.066, 0.0188],
  [ 0.093, 0.0134],
  [ 0.107, 0.0069],
  [ 0.117, 0.0075],
  [ 0.130, 0.0077]
]
# The emitter window, modelled as an emissive sphere just inside the tip so
# the pulse throws light onto the skin under the path tracer (the env drives
# it via TatbotDrawEnv._pulse_emitter). The COLOUR is a rendering choice,
# not a measurement: blue reads as "firing" on camera.
tip_detail:
  kind: emitter
  radius_m: 0.0035
  inset: 0.35
  # green pulled down from 0.30: at 2.6x it rendered cyan, not blue
  color: "0.05 0.16 1.00 1"
  hz: 9.0
  # Emission is RGBA and the tonemap clips per channel: keep the peak low
  # enough that only blue saturates, or the flash renders white.
  peak: 2.6

tip_mesh: null
# One per profile segment: chrome tail, three of white shell, chrome nose.
# Chrome sits below 0.8 on purpose — TatbotDrawEnv turns anything that dark
# metallic, and a bright base under a metallic shader washes out to white.
segment_colors: [
  "0.60 0.63 0.67 1",
  "0.94 0.94 0.93 1",
  "0.94 0.94 0.93 1",
  "0.94 0.94 0.93 1",
  "0.60 0.63 0.67 1",
  "0.60 0.63 0.67 1",
  "0.60 0.63 0.67 1",
  "0.55 0.63 0.72 1"
]

# NOT MODELLED: the black LED panel and its two buttons on ONE side of the
# shell (z = -0.04 .. 0.03); a profile of revolution would band them all the
# way round, which reads worse in a wrist camera than leaving them off.

# A CONTACT tool despite being a laser: the plastic tip rests on the skin
# with the emitter focused at it (operator, 2026-08-25), so the working
# point is the tip itself and a touch-off measures it the ordinary way. The
# registry's non-contact support is for standoff hardware; see docs/tools.md.
contact: true

body_color: "0.94 0.94 0.93 1"
tip_color: "0.60 0.63 0.67 1"

mass_kg: 0.175
com_z_m: null

# Wide, because the 15.4 mm lens face is blunt: what remains uncertain is
# where a future mount repeats to and the traced-vs-calipered disagreement
# along the body, and neither is narrowed by knowing the protrusion.
tip_tolerance_m: 0.030

# --- ink supply -------------------------------------------------------------
# A laser removes pigment; it has no ink and never dips. Tasks that need an
# ink supply are refused with this tool fitted (tatbot_sim.tasks.validate_task).
ink:
  mode: none

measured:
  status: measured
  utc: 2026-08-26T00:00:00Z
  method: "protrusion, grip point and grip force on the arm; tip by touch-off; body silhouette traced from photographs on 6 mm graph paper"
  note: |
    Traced from photographs (2026-08-25) on 6 mm graph paper, grid pitch
    107.5 px by FFT (17.9 px/mm): 214 mm long, widest 37.8 mm. Scale
    corroborated on the arm — the jaws closed on the grip point at 29.6 mm
    against 30 mm predicted. The trace follows the THIN axis of an ovoid
    shell; the thick axis is ~15% larger (widest nearer 43 mm), still well
    inside the jaws. Grip point measured 2026-08-25: 130 mm proud of the
    fingertips. Mass is the retailer listing's 175 g, unweighed.

    Touched off 2026-08-26 (session sweep-20260826_122203): nine planted
    holds put the tip 136.3 mm out, rms 4.26 mm — the 15.4 mm contact face,
    not aim; workspace.yaml carried the residual beside the number. Status
    raised to measured by the operator that day.

    STILL OPEN: the body profile is traced, not calipered, and the traced
    thin-axis diameter at the grip point (32.2 mm) disagrees with the arm's
    29.6 mm — read as photo error, unresolved. Calipers along the shell
    would settle it in minutes. Fit in the thin orientation; the geometry
    assumes it.
