# What the tools work ON, one entry per physical substrate.
#
# A tool and a substrate come as a pair on this bench: the ballpoint draws on
# the two paper fixtures, the needle cartridges tattoo silicone practice skin
# or human skin, and the laser works on the silicone skin. Each tool datasheet
# names its default substrate and the others it admits, so nothing has to
# guess from context and a tool swap moves the whole scene with it.
#
# Dimensions are measured, not nominal. The sim sizes its fixtures from
# these, and the real workspace records its plane against the same numbers.
# Inkmap's Paper and Cylinder workspaces default to the same fixtures
# (web/inkmap/src/core/fixtures.ts, held equal to this file by a test).
#
# A `shape` says how the material is presented. `pad` (the default) is a flat
# sheet a scenario may still lay over a support; `cylinder` is a rigid fixture
# with one fixed radius, which the scenario cannot flatten.

schema_version: 1

paper_pad:
  display_name: gridded paper pad
  # 7.5 x 11 in pad, 1 cm thick, as the operator's pad measures (2026-09-11)
  width_m: 0.1905
  height_m: 0.2794
  thickness_m: 0.010
  # printed 1/4 in (6.35 mm) square grid; the maze task traces it, so it is
  # the stencil
  ruled: true
  grid_pitch_m: 0.00635
  # white paper, faint blue rules
  base_color: 1.0 1.0 1.0
  rule_color: 0.62 0.74 0.90

paper_cylinder:
  display_name: gridded paper cylinder
  # A rigid cylinder wrapped in the same gridded paper: 85 mm diameter,
  # 7.5 in (190.5 mm) long (2026-09-11). Its axis lies along canvas v, so
  # height_m is the cylinder's length and width_m is the ARC the drawable
  # band spans around the crest: the whole outer surface except the bottom
  # quarter it rests on, 135 degrees either side of the top. The full
  # circumference is 267 mm and is textured all the way round; the end caps
  # are never drawn on. thickness_m is the diameter, so the actor origin is
  # the axis.
  shape: cylinder
  diameter_m: 0.085
  width_m: 0.2003
  height_m: 0.1905
  thickness_m: 0.085
  ruled: true
  grid_pitch_m: 0.00635
  base_color: 1.0 1.0 1.0
  rule_color: 0.62 0.74 0.90

silicon_skin:
  display_name: silicone practice skin
  # measured 2026-08-26; the material can be presented flat or wrapped around
  # a cylindrical support. Surface profile is selected by the sim recipe.
  width_m: 0.140
  height_m: 0.185
  thickness_m: 0.0025
  # blank: there is no ruling to trace, so a removal episode's target is ink
  # that is already there rather than a printed line
  ruled: false
  # pink/peach, the colour practice skin is sold in
  base_color: 0.91 0.71 0.65

human_skin:
  display_name: human skin
  # A person's skin, e.g. the outer forearm. The drawing stack measures the
  # surface it draws on each run (the wrist gauge, and `ros up --surface
  # fitted` on a curved limb), so these numbers only size a sim stand-in and
  # are nominal, not measured: a 60 x 180 mm forearm band, ~2 mm of skin.
  # Rides, dips and motion are the needle cartridge's, exactly as on the
  # silicone skin; depth is trimmed live from the station keyboard.
  width_m: 0.060
  height_m: 0.180
  thickness_m: 0.002
  ruled: false
  base_color: 0.87 0.68 0.56
