# What the tools work ON, one entry per physical substrate.
#
# A tool and a substrate come as a pair on this bench: the needle cartridges
# tattoo the silicone practice skin or human skin, and the laser works on the
# silicone skin. Each tool datasheet names its default substrate and the
# others it admits, so nothing has to guess from context and a tool swap moves
# the whole scene with it.
#
# Dimensions are measured, not nominal (human skin's excepted, see its entry).
# The sim sizes its fixtures from these, and the real workspace records its
# plane against the same numbers.
#
# An entry is the material, a flat sheet. How it is presented is the rig's:
# the robot draws the silicone skin on a printed skin mount, and a sim
# scenario lays the same sheet over whatever mount its fixture states
# (config/sim2/fixtures/: a cylinder's top, or a spline mount's CAD design).

schema_version: 1

silicon_skin:
  display_name: silicone practice skin
  # measured 2026-08-26
  width_m: 0.140
  height_m: 0.185
  thickness_m: 0.0025
  # pink/peach, the colour practice skin is sold in
  base_color: 0.91 0.71 0.65

human_skin:
  display_name: human skin
  # A person's skin, e.g. the outer forearm. The drawing stack measures the
  # surface it draws on each run (the wrist gauge, and `ros up --surface
  # fitted` on a curved limb), so these numbers only size a sim stand-in and
  # are nominal, not measured: a 60 x 180 mm forearm band, ~2 mm of skin.
  # Rides, dips and motion are the needle cartridge's, exactly as on the
  # silicone skin; depth is trimmed live from the station keyboard.
  width_m: 0.060
  height_m: 0.180
  thickness_m: 0.002
  base_color: 0.87 0.68 0.56
