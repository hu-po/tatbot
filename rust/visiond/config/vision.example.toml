# Example visiond sensor registry. Copy to vision.toml and describe YOUR
# cameras: any number of RealSense depth cameras, including none — the daemon
# derives everything (names, counts, streams) from this file, never from code.

schema_version = 1

[session]
# Development-only default — recordings vanish on reboot. Deploys set a real
# disk here or via TATBOT_VISIOND_RECORD_ROOT (env beats this file).
record_root = "/tmp/tatbot-vision-recordings"
queue_capacity = 8

[sync]
# The widest gap between two cameras' frames that still counts as one set.
max_pairwise_skew_ms = 40.0

[[cameras.realsense]]
name = "realsense2"
serial = "000000000000"
# Which wrist camera this is; consumers map by role, never by file order.
role = "wrist_upper"
group = "d405"
arm = "right"
owner_role = "realsense"
# Two cameras on one arm each name their frames in urdf/tatbot.urdf.
optical_frame = "right/realsense_color_optical_frame"
depth_optical_frame = "right/realsense_depth_optical_frame"

[cameras.realsense.color]
stream = "color"
width = 640
height = 480
fps_num = 30
fps_den = 1
format = "yuyv"

[cameras.realsense.depth]
stream = "depth"
width = 640
height = 480
fps_num = 30
fps_den = 1
format = "z16"

[[cameras.realsense]]
name = "realsense1"
serial = "000000000001"
# The same wrist's second D405, its mount turned 180 deg about the wrist.
role = "wrist_lower"
group = "d405"
arm = "right"
owner_role = "realsense"
optical_frame = "right/realsense_lower_color_optical_frame"
depth_optical_frame = "right/realsense_lower_depth_optical_frame"

[cameras.realsense.color]
stream = "color"
width = 640
height = 480
fps_num = 30
fps_den = 1
format = "yuyv"

[cameras.realsense.depth]
stream = "depth"
width = 640
height = 480
fps_num = 30
fps_den = 1
format = "z16"
