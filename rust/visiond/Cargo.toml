[package]
name = "tatbot-visiond"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Tatbot 2.0 sensor capture, timestamping, and evidence service"

[features]
default = []
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:image"]
realsense = ["dep:realsense-rust"]
rerun = ["dep:rerun", "dep:urdf-rs", "dep:image", "dep:rayon"]
fiducials = ["dep:apriltag", "dep:nalgebra", "dep:rayon"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }
gstreamer-video = { version = "0.24", optional = true }
realsense-rust = { version = "1.3", optional = true }
rerun = { version = "0.36.0", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }
rayon = { version = "1", optional = true }
urdf-rs = { version = "0.9", optional = true }
apriltag = { version = "0.4", optional = true }
nalgebra = { version = "0.33", optional = true }

[dev-dependencies]
tempfile = "3"
