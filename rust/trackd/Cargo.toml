[package]
name = "trackd"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# The wrist tracker needs the AprilTag detector; the library (the socket
# merge, the evidence file, the estimator worker) and the stencil observer do
# not, so a daemon that only hosts the estimator can depend on the library
# without compiling the detector.
default = ["fiducials"]
fiducials = ["tatbot-visiond/fiducials"]

[lib]
name = "trackd"
path = "src/lib.rs"

[[bin]]
name = "trackd"
path = "src/main.rs"
required-features = ["fiducials"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tatbot-bus = { path = "../tatbot-bus", features = ["zenoh"] }
tatbot-visiond = { path = "../visiond", features = ["zenoh"] }
zenoh = { version = "1.10", default-features = false, features = ["transport_tcp"] }

[dev-dependencies]
tempfile = "3"
