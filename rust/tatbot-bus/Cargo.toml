[package]
name = "tatbot-bus"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
zenoh = ["dep:zenoh"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zenoh = { version = "1.10", optional = true, default-features = false, features = ["transport_tcp"] }
