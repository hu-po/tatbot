# Tool configuration only — this repo no longer ships a root Python package.
# Installable Python code lives in python/lerobot_robot_tatbot (own pyproject).

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 110
target-version = "py311"
fix = true
show-fixes = true
exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"
